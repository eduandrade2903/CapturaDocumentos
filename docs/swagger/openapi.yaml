  /processo/{id}:
    get:
      tags:
        - Processo
      summary: Consultar Processo por ID
      description: Retorna os dados do processo cadastrado a partir de seu identificador numérico.
      parameters:
        - name: id
          in: path
          required: true
          description: ID único do processo
          schema:
            type: integer
            example: 42
      responses:
        '200':
          description: Dados do processo retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/Processo'
        '400':
          description: Processo não encontrado ou erro na consulta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Processo
      summary: Atualizar Processo
      description: Atualiza os dados de um processo existente pelo seu ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID único do processo
          schema:
            type: integer
            example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  properties:
                    nome_completo:
                      type: string
                      example: Maria Oliveira Silva
                    email:
                      type: string
                      format: email
                      example: maria.silva@email.com
                    telefone:
                      type: string
                      example: "11977776666"
      responses:
        '200':
          description: Processo atualizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
        '400':
          description: Processo inexistente ou erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

