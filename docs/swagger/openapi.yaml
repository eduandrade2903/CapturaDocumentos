    #     required: true
    #     content:
    #       application/json:
    #         schema:
    #           type: object
    #           required:
    #             - cliente_id
    #             - processo_id
    #           properties:
    #             cliente_id:
    #               type: integer
    #               description: ID do cliente solicitante
    #               example: 1
    #             processo_id:
    #               type: integer
    #               description: ID do processo/titular
    #               example: 42
    #             status:
    #               type: string
    #               description: Status inicial (padrão 'pendente')
    #               example: pendente
    #   responses:
    #     '201':
    #       description: Solicitação de coleta criada com sucesso
    #       content:
    #         application/json:
    #           schema:
    #             type: object
    #             properties:
    #               status:
    #                 type: string
    #                 example: success
    #               message:
    #                 type: string
    #                 example: Solicitação de coleta criada com sucesso
    #               data:
    #                 $ref: '#/components/schemas/CollectionRequest'
    #     '400':
    #       description: Erro nos parâmetros da requisição
    #       content:
    #         application/json:
    #           schema:
    #             $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - CollectionRequest
      summary: Listar Solicitações de Coleta
      description: Retorna as solicitações de coleta pertencentes ao cliente autenticado pela chave `api_key`.
      parameters:
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/orderParam'
        - $ref: '#/components/parameters/directionParam'
        - $ref: '#/components/parameters/filtersParam'
      responses:
        '200':
          description: Lista de solicitações de coleta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionRequest'
        '403':
          description: Acesso não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - CollectionRequest
      summary: Atualizar Solicitação de Coleta
      description: Atualiza o status de uma solicitação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '#/components/schemas/CollectionRequest'
      responses:
        '200':
          description: Solicitação atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success

