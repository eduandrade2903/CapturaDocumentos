  /processo:
    post:
      tags:
        - Processo
      summary: Criar Processo (com Coleta Automática)
      description: |
        Cadastra um novo processo/titular para o cliente autenticado, vinculando os tipos de documentos solicitados (`tipos_documentos`). 
        
        Automaticamente gera uma **Solicitação de Coleta (`CollectionRequest`)** e os registros em `CollectionRequestDocumento`. Retorna o `token_unico` para a jornada de envio dos documentos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - nome_completo
                    - num_documento
                    - email
                    - telefone
                    - tipos_documentos
                  properties:
                    nome_completo:
                      type: string
                      description: Nome completo do titular do processo
                      example: Maria Oliveira Souza
                    num_documento:
                      type: string
                      description: Numero de um documento do titular
                      example: "12345678901"
                    email:
                      type: string
                      format: email
                      description: E-mail do titular
                      example: maria.souza@email.com
                    telefone:
                      type: string
                      description: Telefone do titular
                      example: "11988887777"
                    tipos_documentos:
                      type: array
                      description: Array contendo os IDs dos tipos de documentos requeridos (ex [1, 2, 4])
                      items:
                        type: integer
                      example: [1, 2, 4]
      responses:
        '201':
          description: Processo e solicitação de coleta criados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Usuário criado com sucesso
                  data:
                    $ref: '#/components/schemas/Processo'
                  token:
                    type: object
                    properties:
                      token_unico:
                        type: string
                        example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        '400':
          description: CPF duplicado, campos obrigatórios ausentes ou tipo de documento não informado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  data:
                    type: string
                    example: "Erro ao criar usuário: CPF já cadastrado no sistema."

    get:
      tags:
        - Processo
      summary: Listar Processos
      description: Retorna a lista paginada e filtrada de processos cadastrados.
      parameters:
        - $ref: '#/components/parameters/offsetParam'
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/orderParam'
        - $ref: '#/components/parameters/directionParam'
        - $ref: '#/components/parameters/filtersParam'
      responses:
        '200':
          description: Lista de processos retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Processo'
        '403':
          description: Chave de API inválida ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

