    #   tags:
    #     - CollectionRequest
    #   summary: Excluir Solicitações de Coleta em Lote
    #   description: Exclui solicitações de coleta que satisfaçam aos filtros enviados.
    #   parameters:
    #     - $ref: '#/components/parameters/filtersParam'
    #   responses:
    #     '200':
    #       description: Solicitações excluídas com sucesso

  /collection/{id}:
    get:
      tags:
        - CollectionRequest
      summary: Consultar Solicitação de Coleta por ID
      description: Retorna os dados de uma solicitação de coleta específica pelo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID da solicitação de coleta
          schema:
            type: integer
            example: 18
      responses:
        '200':
          description: Solicitação encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/CollectionRequest'
        '400':
          description: Solicitação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - CollectionRequest
      summary: Excluir Solicitação de Coleta por ID
      description: Remove uma solicitação de coleta pelo ID.
      parameters:
        - name: id
          in: path
          required: true
          description: ID da solicitação a ser removida
          schema:
            type: integer
            example: 18
      responses:
        '200':
          description: Solicitação excluída com sucesso

  /collection/{token_unico}:
    get:
      tags:
        - CollectionRequest
      summary: Consultar Solicitação por Token Único (Jornada)
      description: |
        Consulta completa dos dados da solicitação a partir do `token_unico`, incluindo nomes do titular (`processo`), da empresa (`cliente`), lista detalhada de documentos exigidos (`documentos_solicitados`) e documentos já submetidos (`documentos_enviados`).
      parameters:
        - name: token_unico
          in: path
          required: true
          description: Token único da jornada de captura
          schema:
            type: string
            example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      responses:
        '200':
          description: Dados detalhados da jornada de coleta
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 18
                      status:
                        type: string
                        example: pendente
                      data_criacao:
                        type: string
                        example: "2026-07-27 11:35:00"
                      data_expiracao:
                        type: string
                        example: "2026-07-28 11:35:00"
                      processo:
                        type: string
                        description: Nome completo do titular do processo
                        example: Maria Oliveira Souza
                      cliente:
                        type: string
                        description: Razão social do cliente solicitante
                        example: Tech Inovações LTDA
                      documentos_solicitados:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 10
                            collection_request_id:
                              type: integer
                              example: 18
                            tipo_documento_id:
                              type: integer
                              example: 2
                            status:
                              type: string
                              example: pendente
                            tipo_documento:
                              type: object
                              properties:
                                id:
                                  type: integer
                                  example: 2
                                nome:
                                  type: string
                                  example: CPF
                                descricao:
                                  type: string
                                  example: Cadastro de Pessoas Físicas ou comprovante
                      documentos_enviados:
                        type: array
                        items:
                          $ref: '#/components/schemas/Documento'
        '400':
          description: Token inválido ou não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /collectionDocumento:
    get:
      tags:
        - CollectionRequestDocumento
      summary: Consultar Documentos Requeridos da Coleta
      description: Retorna os tipos de documentos requeridos para uma solicitação de coleta por ID (`tipos_documentos`) ou por `token`.
      parameters:
        - name: tipos_documentos
          in: query
          required: false
          description: ID da solicitação de coleta (`CollectionRequest ID`)
          schema:
            type: integer
            example: 18
        - name: token
          in: query
          required: false
          description: Token único da solicitação de coleta
          schema:
            type: string
            example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      responses:
        '200':
          description: Lista de documentos exigidos retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionRequestDocumento'
        '400':
          description: Parâmetro não informado ou solicitação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - CollectionRequestDocumento
      summary: Vincular Novo Documento à Solicitação
      description: Associa um tipo de documento específico a uma solicitação de coleta existente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - collection_request_id
                    - tipo_documento_id
                  properties:
                    collection_request_id:
                      type: integer
                      example: 18
                    tipo_documento_id:
                      type: integer
                      example: 1
      responses:
        '201':
          description: Documento vinculado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documento da solicitação de coleta criado com sucesso
                  data:
                    $ref: '#/components/schemas/CollectionRequestDocumento'
        '400':
          description: Erro ao vincular documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tiposDocumentos:
    get:
      tags:
        - TiposDocumentos
      summary: Listar Tipos de Documentos Aceitos
      description: Retorna a lista de todos os tipos de documentos aceitos pelo sistema cadastrados e ativos.
      responses:
        '200':
          description: Tipos de documentos ativos retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TiposDocumentos'
                example:
                  - id: 1
                    nome: RG / CIN
                    descricao: Registro Geral RG ou Carteira de Identidade Nacional CIN.
                  - id: 2
                    nome: CPF
                    descricao: Cadastro de Pessoas Físicas ou comprovante de situação cadastral.
                  - id: 4
                    nome: CNH
                    descricao: Carteira Nacional de Habilitação.
        '403':
          description: Acesso não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - TiposDocumentos
      summary: Cadastrar Novo Tipo de Documento
      description: Adiciona um novo tipo de documento aceito pelo sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nome
              properties:
                nome:
                  type: string
                  example: COMPROVANTE DE RENDA
                descricao:
                  type: string
                  example: Holerite ou declaração de imposto de renda recente.
      responses:
        '200':
          description: Tipo de documento cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Tipo de documento cadastrado com sucesso.
        '400':
          description: Erro ao cadastrar tipo de documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documento:
    get:
      tags:
        - Documento
      summary: Obter Informações da Coleta para Upload
      description: Retorna a solicitação de coleta e a lista de documentos exigidos com base no `token_unico` fornecido via query string.
      parameters:
        - name: token_unico
          in: query
          required: true
          description: Token único da solicitação de coleta
          schema:
            type: string
            example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
      responses:
        '200':
          description: Dados da solicitação e documentos exigidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection_request_id:
                    type: integer
                    example: 18
                  token_unico:
                    type: string
                    example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                  status_request:
                    type: string
                    example: pendente
                  data_expiracao:
                    type: string
                    example: "2026-07-28 11:35:00"
                  documentos_exigidos:
                    type: array
                    items:
                      type: object
                      properties:
                        tipo_documento_id:
                          type: integer
                          example: 1
                        descricao:
                          type: string
                          example: RG / CIN
                        status:
                          type: string
                          example: pendente
        '400':
          description: Token não fornecido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Solicitação não encontrada ou token expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Documento
      summary: Enviar Arquivos / Upload de Documentos
      description: |
        Recebe arquivos enviados pelo titular através de `multipart/form-data` ou `application/json` (com imagens codificadas em Base64).
        
        Associa cada arquivo ao seu respectivo `tipo_documento_id`, salva o arquivo em disco/armazenamento e atualiza a situação da coleta. Opcionalmente aceita `extracted_data` (OCR).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - token_unico
              properties:
                token_unico:
                  type: string
                  description: Token único da solicitação de coleta
                  example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                extracted_data:
                  type: string
                  description: JSON string contendo dados OCR extraídos previamente
                  example: '{"nome": "Maria Oliveira Souza", "cpf": "12345678901"}'
                documento[1]:
                  type: string
                  format: binary
                  description: Arquivo para o tipo_documento_id = 1 (ex RG)
                documento[2]:
                  type: string
                  format: binary
                  description: Arquivo para o tipo_documento_id = 2 (ex CPF)
          application/json:
            schema:
              type: object
              required:
                - token_unico
              properties:
                token_unico:
                  type: string
                  example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                extracted_data:
                  type: object
                  description: Objeto com dados extraídos via OCR
                  example:
                    nome: Maria Oliveira Souza
                    cpf: "12345678901"
                files:
                  type: array
                  items:
                    type: object
                    required:
                      - tipo_documento_id
                      - file
                    properties:
                      tipo_documento_id:
                        type: integer
                        example: 1
                      file:
                        type: string
                        description: Conteúdo do arquivo em Base64 (com ou sem data URI prefix)
                        example: data:image/jpeg;base64,/9j/4AAQSkZJRg...
      responses:
        '201':
          description: Documentos enviados e salvos com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documento enviados e salvos com sucesso.
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Documento'
        '400':
          description: Nenhum arquivo enviado ou token ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Solicitação de coleta expirada ou não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Tipo de documento enviado não corresponde aos solicitados na coleta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /documentosAnalise:
    post:
      tags:
        - Documento
      summary: Analisar Documento com Inteligência Artificial
      description: |
        Endpoint especializado para validação em tempo real e extração de dados de um documento utilizando Inteligência Artificial (`DocumentAnalyzerService`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - tipo_documento_id
              properties:
                file:
                  type: string
                  format: binary
                  description: Arquivo de imagem ou PDF do documento a ser inspecionado
                tipo_documento_id:
                  type: integer
                  description: ID do tipo de documento esperado (ex 1 para RG, 4 para CNH)
                  example: 4
      responses:
        '201':
          description: Documento validado com sucesso pela IA e dados extraídos
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Documento validado com sucesso!
                  dados_extraidos:
                    type: object
                    properties:
                      nome:
                        type: string
                        example: MARIA OLIVEIRA SOUZA
                      cpf:
                        type: string
                        example: "123.456.789-01"
                      rg:
                        type: string
                        example: "12.345.678-9"
                      data_nascimento:
                        type: string
                        example: "1990-05-15"
        '422':
          description: Documento incorreto ou não condizente com o tipo esperado
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: fail
                  message:
                    type: string
                    example: Documento Incorreto.
                  motivo_rejeicao:
                    type: string
                    example: "404"
        '500':
          description: Erro interno no servidor ou serviço de IA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhook-event:
    get:
      tags:
        - WebhookEvent
      summary: Consultar Histórico de Eventos de Webhook
      description: Retorna a lista de eventos de Webhook gerados e disparados para o cliente autenticado pela chave `api_key`.
      responses:
        '200':
          description: Histórico de eventos retornado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEvent'
        '403':
          description: Chave de API inválida ou não informada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Nenhum webhook encontrado para este cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    basicAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Autenticação de gateway do framework. Insira o valor no formato: `Basic <REST_KEY>` (ex: `Basic minha_rest_key`).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT retornado pelo endpoint `/auth/{login}/{password}`.
    apiKeyHeader:
      type: apiKey
      in: header
      name: api_key
      description: Chave de API exclusiva do cliente fornecida no cadastro.

  parameters:
    offsetParam:
      name: offset
      in: query
      required: false
      description: Deslocamento para paginação de registros
      schema:
        type: integer
        default: 0
        example: 0
    limitParam:
      name: limit
      in: query
      required: false
      description: Limite de registros retornados por página
      schema:
        type: integer
        default: 10
        example: 10
    orderParam:
      name: order
      in: query
      required: false
      description: Nome do campo para ordenação
      schema:
        type: string
        example: id
    directionParam:
      name: direction
      in: query
      required: false
      description: Direção da ordenação (`asc` ou `desc`)
      schema:
        type: string
        enum: [asc, desc]
        default: asc
        example: asc
    filtersParam:
      name: filters
      in: query
      required: false
      description: |
        Filtros estruturados para listagem. Pode ser enviado como string JSON (ex: `[["status", "=", "pendente"]]`).
      schema:
        type: string
        example: '[["status", "=", "pendente"]]'

  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        data:
          type: string
          description: Mensagem descritiva do erro
          example: Chave de API invalida.
        message:
          type: string
          description: Mensagem alternativa de erro
          example: Sem autorizacao.

    Cliente:
      type: object
      properties:
        id:
          type: integer
          example: 1
        system_user_id:
          type: integer
          description: ID do usuário vinculado no painel administrativo
          example: 15
        razao_social:
          type: string
          example: Tech Inovações LTDA
        cnpj:
          type: string
          example: "12.345.678/0001-90"
        nome_contato:
          type: string
          example: Carlos Eduardo
        email:
          type: string
          format: email
          example: contato@techinovacoes.com.br
        telefone:
          type: string
          example: "(11) 98765-4321"
        webhook_url:
          type: string
          format: uri
          example: https://api.techinovacoes.com.br/webhooks/captura
        data_cadastro:
          type: string
          example: "2026-07-27 10:00:00"

    Processo:
      type: object
      required:
        - id
        - nome_completo
        - cpf
        - email
        - telefone
      properties:
        id:
          type: integer
          example: 42
        nome_completo:
          type: string
          example: Maria Oliveira Souza
        cpf:
          type: string
          example: "12345678901"
        email:
          type: string
          format: email
          example: maria.souza@email.com
        telefone:
          type: string
          example: "11988887777"

    CollectionRequest:
      type: object
      properties:
        token_unico:
          type: string
          description: Token único gerado para a jornada de envio
          example: e3b0c44298fc1c149
        status:
          type: string
          description: Status do ciclo de vida da coleta
          example: pendente
        data_expiracao:
          type: string
          example: "2026-07-28 11:35:00"

    CollectionRequestDocumento:
      type: object
      properties:
        id:
          type: integer
          example: 10
        collection_request_id:
          type: integer
          description: ID da solicitação de coleta vinculada
          example: 18
        tipo_documento_id:
          type: integer
          description: ID do tipo de documento exigido
          example: 2
        status:
          type: string
          description: Status de upload do documento específico
          example: pendente
        data_criacao:
          type: string
          description: Data de registro do documento na solicitação
          example: "2026-07-27 11:35:00"
        tipo_documento:
          type: object
          properties:
            id:
              type: integer
              example: 2
            nome:
              type: string
              example: CPF
            descricao:
              type: string
              example: Cadastro de Pessoas Físicas ou comprovante de situação cadastral
            ativo:
              type: boolean
              example: true

    TiposDocumentos:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: RG / CIN
        descricao:
          type: string
          example: Registro Geral RG ou Carteira de Identidade Nacional CIN.
        ativo:
          type: integer
          example: 1

    Documento:
      type: object
      properties:
        id:
          type: integer
          example: 5
        collection_request_id:
          type: integer
          description: ID da solicitação de coleta vinculada (CollectionRequest ID)
          example: 18
        tipo_documento_id:
          type: integer
          description: ID do tipo de documento
          example: 1
        storage_path:
          type: string
          description: Caminho de armazenamento do arquivo no servidor
          example: tmp/doc_18_1_1691350800_64cf7a2b.jpg
        status:
          type: string
          description: Status de validação do documento
          example: APROVADO
        motivo_rejeicao:
          type: string
          nullable: true
          description: Motivo da rejeição se houver
          example: null
        data_upload:
          type: string
          description: Data e hora do upload do documento
          example: "2026-08-06 12:15:00"

    ExtratedData:
      type: object
      properties:
        id:
          type: integer
          example: 3
        collection_request_id:
          type: integer
          example: 18
        payload_ocr:
          type: string
          description: JSON serializado com os dados extraídos pelo OCR/IA
          example: '{"nome": "Maria Oliveira Souza", "cpf": "12345678901"}'
        score_confianca:
          type: number
          format: float
          example: 0.98
        processado_em:
          type: string
          example: "2026-08-06 12:16:00"

    WebhookEvent:
      type: object
      properties:
        id:
          type: string
          example: "101"
        cliente_id:
          type: string
          example: "1"
        tipo_evento:
          type: string
          description: Tipo de evento registrado
          example: document.uploaded
        payload:
          type: string
          description: Payload serializado em JSON enviado no Webhook
          example: '{"solicitacao_id": 18, "processo_id": 42, "documento": "cnh.pdf", "status": "sucesso"}'
        status_envio:
          type: string
          description: Status da entrega do webhook
          example: sucesso
        tentativas:
          type: string
          description: Quantidade de tentativas de envio
          example: "1"
        criado_em:
          type: string
          example: "2026-07-27 12:00:00"
