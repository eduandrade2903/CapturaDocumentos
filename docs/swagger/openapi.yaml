openapi: 3.0.0
info:
  title: API de Captura de Documentos
  description: |
    API REST para gestão de clientes, processos de titulares, controle de solicitações de coleta de documentos, análise de documentos com IA e histórico de Webhooks.

    ### Mecanismos de Autenticação
    As rotas estão protegidas pelas camadas de segurança do framework e do domínio da aplicação:
    1. **Autenticação de Gateway (rest.php):** Necessária para a segurança do framework Adianti. Pode ser feita via **Basic Auth** (utilizando a chave REST global da aplicação) ou **Bearer Token** (utilizando o token JWT retornado pelo endpoint `/auth`).
    2. **Autenticação de Domínio (api_key):** Exigida nas rotas de negócio através do cabeçalho `api_key`, identificando o cliente ativo e isolando seus dados.
  version: 2.0.0

servers:
  - url: http://localhost:8080/
    description: Servidor de Desenvolvimento Local (Via rest.php / rotas amigáveis)

security:
  - basicAuth: []
    apiKeyHeader: []
  - bearerAuth: []
    apiKeyHeader: []

paths:
  /auth/{login}/{password}:
    get:
      tags:
        - Auth
      summary: Obter Token JWT (Login)
      description: |
        Autentica o usuário administrativo no sistema e gera um token JWT (JSON Web Token) válido por 3 horas.
        
        **Atenção:** Como esta rota é processada pelo gateway `rest.php`, ela requer o cabeçalho `Authorization: Basic <REST_KEY>` para autorização inicial, além do login e senha passados no path.
      security:
        - basicAuth: []
      parameters:
        - name: login
          in: path
          required: true
          description: E-mail ou Login cadastrado do usuário
          schema:
            type: string
            example: contato@empresa.com.br
        - name: password
          in: path
          required: true
          description: Senha de acesso do usuário
          schema:
            type: string
            example: Abcd@1234
      responses:
        '200':
          description: Token JWT gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: string
                    description: Token JWT codificado em HS256
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyIjoiY29udGF0b0BlbXByZXNhLmNvbS5iciIsInVzZXJpZCI6MTUsInVzZXJuYW1lIjoiVGVjaCBJbm92YcOnw7VlcyIsInVzZXJtYWlsIjoiY29udGF0b0BlbXByZXNhLmNvbS5iciIsImV4cGlyZXMiOjE3OTIxNjYwMDB9.signature
        '401':
          description: Falha de autenticação (usuário ou senha incorretos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno no servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cliente:
    post:
      tags:
        - Cliente
      summary: Cadastrar Novo Cliente
      description: |
        Cadastra um novo cliente no sistema, cria sua conta administrativa e envia as credenciais de acesso e a chave `api_key` gerada para o e-mail cadastrado.
        
        **Atenção:** Esta rota de cadastro não requer o cabeçalho `api_key`.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  required:
                    - razao_social
                    - cnpj
                    - nome_contato
                    - email
                  properties:
                    razao_social:
                      type: string
                      description: Razão social completa do cliente/empresa
                      example: Tech Inovações LTDA
                    cnpj:
                      type: string
                      description: CNPJ do cliente (com ou sem pontuação)
                      example: "12.345.678/0001-90"
                    nome_contato:
                      type: string
                      description: Nome da pessoa de contato principal
                      example: Carlos Eduardo
                    email:
                      type: string
                      format: email
                      description: E-mail de contato e login administrativo
                      example: contato@techinovacoes.com.br
                    telefone:
                      type: string
                      description: Telefone comercial
                      example: "(11) 98765-4321"
                    webhook_url:
                      type: string
                      format: uri
                      description: URL HTTP(S) onde os eventos assíncronos serão disparados
                      example: https://api.techinovacoes.com.br/webhooks/captura
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema:
                type: array
                items: {}
                example: []
        '400':
          description: Dados obrigatórios inválidos ou ausentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro interno ao cadastrar cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - Cliente
      summary: Consultar Dados do Cliente
      description: Retorna os dados cadastrais do cliente associado à chave de API (`api_key`) enviada nos cabeçalhos.
      responses:
        '200':
          description: Dados cadastrais do cliente retornados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente:
                    $ref: '#/components/schemas/Cliente'
        '403':
          description: Chave de API inválida ou não fornecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Cliente
      summary: Atualizar Dados do Cliente
      description: Atualiza os dados cadastrais do cliente associado à chave de API (`api_key`) enviada nos cabeçalhos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: object
                  properties:
                    nome_contato:
                      type: string
                      example: Carlos Eduardo Silva
                    telefone:
                      type: string
                      example: "(11) 99999-8888"
                    webhook_url:
                      type: string
                      format: uri
                      example: https://nova-api.techinovacoes.com.br/webhooks
      responses:
        '200':
          description: Dados atualizados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  cliente:
                    $ref: '#/components/schemas/Cliente'
        '403':
          description: Chave de API inválida ou não fornecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Cliente não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

