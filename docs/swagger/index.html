<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <title>API de Captura de Documentos - Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
    <link rel="icon" type="image/png" href="../../favicon.png" />
    <style>
      html {
        box-sizing: border-box;
        overflow: -moz-scrollbars-vertical;
        overflow-y: scroll;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        background: #fafafa;
        font-family: 'Outfit', 'Inter', -apple-system, sans-serif;
      }
      .swagger-ui .topbar {
        background-color: #0b1a30;
        padding: 10px 0;
        border-bottom: 3px solid #62d3ea;
      }
      .swagger-ui .topbar .download-url-wrapper input[type=text] {
        border: 1px solid #62d3ea;
      }
      .swagger-ui .topbar .download-url-wrapper .download-url-button {
        background: #62d3ea;
        color: #0b1a30;
      }
      .custom-header {
        background: #0b1a30;
        color: #fff;
        padding: 20px 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 4px solid #62d3ea;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }
      .custom-header h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
        background: linear-gradient(135deg, #fff 0%, #62d3ea 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .custom-header a {
        color: #62d3ea;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        transition: color 0.2s ease;
      }
      .custom-header a:hover {
        color: #fff;
      }
    </style>
  </head>

  <body>
    <header class="custom-header">
      <h1>Documentação da API</h1>
      <a href="openapi.yaml" target="_blank">View OpenAPI Specification (YAML)</a>
    </header>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" charset="UTF-8"> </script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js" charset="UTF-8"> </script>
    <script>
      window.onload = function() {
        // Begin Swagger UI call region
        const ui = SwaggerUIBundle({
          url: "openapi.yaml",
          dom_id: '#swagger-ui',
          deepLinking: true,
          presets: [
            SwaggerUIBundle.presets.apis,
            SwaggerUIStandalonePreset
          ],
          plugins: [
            SwaggerUIBundle.plugins.DownloadUrl
          ],
          layout: "BaseLayout",
          persistAuthorization: true
        });
        // End Swagger UI call region
        window.ui = ui;
      };
    </script>
  </body>
</html>
